# PS/2 mouse / trackpoint (Exp68 - direct, no coprocessor)
# features: dabase-parity bench config on the pr/optional-features driver.
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_INPUT_LISTENER=y

# Exp66: smooth scrolling (HID Resolution Multiplier) for sub-detent scroll
# precision - the scroll override (hold J) feeds shaped deltas into this.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Exp78: uart-ps2 backend @ 19200 baud - the one rate never tried on this
# jittery-clock trackpoint (9600 phase-walks, 14400 was 50/50 erratic).
# This TP rejects ALL host commands (Exp06), so NO_HOST_COMMANDS stays and
# the driver never writes - every decode adjustment happens driver-side.
CONFIG_PS2=y
CONFIG_PS2_UART=y
CONFIG_PS2_GPIO=n

# Exp68: never send any PS/2 command (trackpoint rejects all of them)
CONFIG_ZMK_INPUT_MOUSE_PS2_NO_HOST_COMMANDS=y
# (error mitigation intentionally OFF: its overflow checks run on the
#  garbled status byte and drop valid packets)

# Final tuning (Exp68); deliberately kept OFF for Exp78 - they would only
# mask whether 19200 decodes cleanly. UART-era anti-glitch filters
# (EMA/median/slew) stay OFF (they did not fix 14400 either; Kconfig-gated,
# default off).
CONFIG_ZMK_INPUT_MOUSE_PS2_MEDIAN_WINDOW=1
CONFIG_ZMK_INPUT_MOUSE_PS2_SLEW_MAX=0
CONFIG_ZMK_INPUT_MOUSE_PS2_MOVEMENT_EMA_N=1

# Exp68: pointer speed - user asked x6 of the last build (which was 1/5).
# Integer divisor floor is 1 (= raw = ~5x of the previous), the closest
# available step up; remainder-accumulated so slow motion isn't lost.
CONFIG_ZMK_INPUT_MOUSE_PS2_SPEED_DIVISOR=1

# pr-verify: on-device PowerCurve + the 1s decode telemetry line.
# The curve props (curve-sens/rate/exponent/start) live in the tpoint0 node.
CONFIG_ZMK_INPUT_MOUSE_PS2_POWER_CURVE=y
CONFIG_ZMK_INPUT_MOUSE_PS2_TELEMETRY=y

# Power: nice_nano v2 P0.13 rail switch drives the bench 3.3V rail.
# Without this, the trackpoint gets NO power (static DAT/CLK, no mouse).
CONFIG_ZMK_EXT_POWER=y

# Shell + logging (AGENTS.md rule: every build has USB logging + shell)
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_LOG=y
# Exp78: aggressive level-4 logging via the shell. LOG_CMDS provides the
# `log` shell command; PS2_LOG_LEVEL=4 raises the ps2 backends' compile-time
# cap so `log enable dbg ps2_uart` shows per-byte decode live on COM8.
# (Exp70 caveat: sustained per-byte DBG over the CDC console can saturate -
# use short captures and `log disable dbg ps2_uart` after.)
CONFIG_LOG_CMDS=y
CONFIG_PS2_LOG_LEVEL=4
# LOG_PRINTK reroutes all printk into the log framework; with the UART backend
# wired up the LOG_* telemetry is visible directly. No LOG_PRINTK.
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# libc (verified with this module - avoids picolibc symbol conflicts;
# power curve calls pow() at init, which NEWLIB handles fine)
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y